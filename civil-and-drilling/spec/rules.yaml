# Rule index (G0/G1). Stable IDs; each rule names its guideline check(s), scope, prerequisites, consequence
# (spec/consequences.yaml), source provisions (page/clause, all second-read — see verification/), tables used,
# overridden provisions (spec/overrides.yaml), open questions (spec/open_questions.yaml) and the validation
# cases later gates must build (G3/G4; independent expected values, not production output).
# status: settled = operative reading fixed by the cited text; open = depends on a listed question.
# pricing: true = the rule feeds a monetary value; its tables must pass the G1 verification gate.

