# Instruments register (G1): both Schedules of Variations and all ten instruments.
# Dates ISO. Rates/percentages as printed. `relationship` records what each row replaces or supplements.
# General provisions governing all instruments are in `schedule_of_variations`; decisions that interpret
# them (A3 recipient, A3 vs S2) live in spec/overrides.yaml and spec/open_questions.yaml.

schedule_of_variations:
  CW:
    page: 38
    read_in_order_issued: true
    text_effect: "Each takes effect on its own effective date and governs work executed on or after it; nothing in an instrument reopens work already measured at the rate then payable."
    term_as_let: ["2025-01-05", "2025-09-27"]
    term_as_extended: ["2025-01-05", "2026-09-30"]
    pricing_date: "date of execution (not application date)"
  DDS:
    page: 37
    read_in_order_issued: true
    text_effect: "Each governs services performed on or after its effective date; nothing in an instrument reopens a service already charged at the rate then chargeable."
    term_as_let: ["2025-01-01", "2025-12-31"]
    term_as_extended: ["2025-01-01", "2026-12-31"]
    pricing_date: "service date (not invoice date)"
  footer_all_instruments: "Where this and an earlier instrument both state a rate or discount for the same item, the later governs work/services on or after its effective date and the earlier governs before it."

