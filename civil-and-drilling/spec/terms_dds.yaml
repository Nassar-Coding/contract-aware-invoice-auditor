# Drilling services contract DDS-2025-118 — contractual terms (G1).
# Same conventions as terms_cw.yaml. Money in USD, cents; half-even at every step (Cl.17).
contract: DDS
reference: DDS-2025-118
currency: USD
minor_unit: cent
source_pdf: drilling_services/contract/DDS-2025-118.pdf

parameters:
  - {id: DDS.P.commencement, value: "2025-01-01", page: 1, provision: "Agreement particulars"}
  - {id: DDS.P.expiry_as_let, value: "2025-12-31", page: 1, provision: "Agreement particulars"}
  - {id: DDS.P.expiry_A1, value: "2026-06-30", page: 39, provision: "A1"}
  - {id: DDS.P.expiry_A2, value: "2026-12-31", page: 41, provision: "A2"}
  - {id: DDS.P.vat_pct, value: "15", page: 8, provision: "Cl.39 (also p1 particulars)", note: "of the net amount, rounded under Cl.17"}
  - {id: DDS.P.submission_window_days, value: "30", page: 8, provision: "Cl.33", note: "not before the last day of the period; within 30 days after it"}
  - {id: DDS.P.rounding, value: "each step to the cent; exact half to the even cent", page: 6, provision: "Cl.17 (p6); 17A (p35); p1 particulars"}
  - {id: DDS.P.invoice_discount_threshold, value: "250,000.00", page: 8, provision: "Cl.38 (p8); P11 (p11)", note: "sum of services on the invoice above threshold"}
  - {id: DDS.P.invoice_discount_pct, value: "4", page: 8, provision: "Cl.38 (p8); P11 (p11)", note: "of the EXCESS over the threshold, rounded Cl.17, single negative charge DS-900; per invoice alone (P11)"}
  - {id: DDS.P.dd120_min_hours, value: "6", page: 6, provision: "Cl.21 (p6); Sch 3 Part 7 (p22); P10 (p11)", note: "on any Operating day the tool is in the hole; per day, not averaged over a run"}
  - {id: DDS.P.first_hour_excluded, value: "1", page: 35, provision: "21A", note: "first hour of each period in the hole is rig-up; report states hours run; invoice charges one fewer"}
  - {id: DDS.P.metre_tolerance_pct, value: "1", page: 35, provision: "25A", note: "charged <= report + 1% payable as charged; beyond, at the report figure"}
  - {id: DDS.P.lih_depreciation, value: "1% per complete 25 circulating hours accumulated on the well, max 50%", page: 7, provision: "Cl.31 (p7); Sch 6 (p25); P12 (p11); 31A (p35)"}
  - {id: DDS.P.depth_boundary_rule, value: "boundary depth belongs to the shallower band", page: 6, provision: "Cl.23; Sch 2 (p17)"}
  - {id: DDS.P.circulating_hour_rounding, value: "part hour of 30 minutes or more = whole hour", page: 14, provision: "R4"}

