# Explicit overrides register (G1). Each entry records the provision displaced, the provision that governs,
# the textual basis (pages second-read, see verification/), and any recorded alternative. No universal
# precedence ranking is used: each conflict is decided on its own text.
# status: settled = decided on explicit wording; decision = settled with a recorded alternative and scope
# (see spec/open_questions.yaml D-entries).

overrides:
  - id: OV-CW-01
    displaced: "Cl.29 (p6): a factor applies only where Sch 2/Sch 3 lists the item's SERIES"
    governs: "Sch 3 (p23): ground factor applies only to the 15 listed ITEMS; Sch 2 (p20): zone factor to Series A-D, not E"
    basis: "Cl.2 (p3): a Schedule prevails over the General Conditions; Sch 3 says 'An item not listed is measured without regard to the ground classification (Clause 29)'."
    status: settled
