  second_pass_visual: verification/second_pass_visual_log.txt
  blind_transcription: verification/blind/ (CW pp17-33,36,38-43; DDS pp8,15-25,27,28,30,34-42)
  ocr: verification/ocr/ (all 85 pages, tesseract 5.3.4 --psm 6)
