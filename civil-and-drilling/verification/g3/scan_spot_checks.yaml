falsification_probes:   # real lines where billing differs from the engine: could the engine be the one that is wrong?
  - line: PA-00115-05
    question: "billed 121.80, engine 121.79 (one halala)"
    finding: "69.20 x 1.28 = 88.576; billing rounded it to 88.58 before x 1.375 (= 121.7975 -> 121.80). Cl.28 (p6) rounds the built-up rate once; exact 121.792 -> 121.79. Engine follows the clause."
  - line: MDS-00586-039
    question: "PD-210 billed 98.70, engine 76.45"
    finding: "charged interval 4,107-4,199 m lies in band 3 (76.45, DDS p17); 98.70 is band 4 (over 4,500 m). Engine follows Sch 2."
  - line: MDS-01387-037
    question: "PD-210 billed 77.05 on an HPHT well, engine 58.15"
    finding: "58.15 is band 2 for 2,829-2,995 m; billing applied a class factor, which 17B (p35) excludes for PD-210 (decision D1; the Sch 2 note on p17 'class-rated under Schedule 3 Part 2' is the recorded alternative)."
  - line: "MDS-00840-023 and 4 other DD-121 lines"
    question: "billed 2,893.65 (the Schedule 1 figure on p15), engine 2,984.00"
    finding: "Supplement No. 1 1.1 (DDS p38) substitutes 2,984.00 for services on or after 2025-07-01; the five lines are on or after that date. Engine follows the instrument."
  - line: PA-00297-07
    question: "D.41.020 billed 72.71, engine 252.47"
    finding: "72.71 = the Sch 1 base 63.50 x zone Z3 1.145; for work in November 2025 S1 cl.1.2 (CW p39) makes the monthly re-measured rate payable; the last published month, September 2025 (220.50, G1-verified table), is carried forward ('the rate last published applies until it is superseded', p39); x 1.145 = 252.4725 -> 252.47. Carry-forward itself is independently confirmed by case CW-S09."
