# G3 reference cases, civil contract CW-2025-0417-CIV: INPUTS ONLY (no expected values).
# Written before the G3 pricing code. Expected values are computed independently from the contract scans by
# independent readers (v1 reader instructions) into expected_*.jsonl.
# Defaults (applied by tools/g3_cases.py): contract_ref CW-2025-0417-CIV, subcontractor Ridgeway Civil Engineering LLC,
# site S-01 Platform North, zone Z1 Compound, ground blank, night N, single-line application whose period is the
# work date and which is submitted 5 days later, record_ref blank, no record, state band_pct 100.
# Each case states only what it changes and what it tests. Unless a case tests the billed rate or arithmetic, the billed
# rate_applied is the Schedule 1 figure as printed and amount = quantity x rate_applied (set by tools/g3_cases.py), so the
# inputs never carry an expected built-up rate.
