# G3 reference cases for review findings F2 and F3, civil contract: INPUTS ONLY (no expected values). Written for
# independent review findings F2 (ground class authority) and F3 (arithmetic where the band is not known) before the readers ran,
# read with the v3 reader instructions. Same defaults as synthetic_cw.yaml; `state` may override them
# (band_pct null = the band state is not known).
defaults:
  application: {contract_ref: CW-2025-0417-CIV, subcontractor: Ridgeway Civil Engineering LLC, submit_after_days: 5}
  line: {site: S-01 Platform North, site_zone: Z1 Compound, ground_class: "", night_work: N, record_ref: ""}
  state: {band_pct: "100", note: "annual quantity-band state is supplied as an input (G4 owns it); no other lines exist"}
cases:
  - {id: CW-S59, tests: "ground item, application states G4, no record supplied (before 27 Sep 2025)", line: {item_code: A.12.050, unit: m3, quantity: "390", work_date: "2025-04-30", ground_class: G4 Weathered Rock, rate_applied: "72.05"}}
  - {id: CW-S60, tests: "ground item, application states G4, the site record states G3", line: {item_code: A.12.030, unit: m3, quantity: "100", work_date: "2025-06-10", ground_class: G4 Weathered Rock, record_ref: DX-90060}, record: {series: DX, title: DAILY EXCAVATION RECORD, area: S-01, date: "2025-06-10", ground: G3, narrative: "trench dig 100 cube, 3 m deep section", signed: both}}
  - {id: CW-S61, tests: "ground item, application states G4, no record supplied, work after 27 Sep 2025", line: {item_code: A.12.050, unit: m3, quantity: "100", work_date: "2025-10-05", ground_class: G4 Weathered Rock}}
  - {id: CW-S62, tests: "band-rated item, band state not known, billed amount not quantity x billed rate", state: {band_pct: null, note: "annual quantity-band state is NOT known (it depends on other lines)"}, line: {item_code: A.13.010, unit: m3, quantity: "258", work_date: "2025-06-10", amount: "4950.00"}}
  - {id: CW-S63, tests: "band-rated item, band state not known, billed amount = quantity x billed rate", state: {band_pct: null, note: "annual quantity-band state is NOT known (it depends on other lines)"}, line: {item_code: A.13.010, unit: m3, quantity: "258", work_date: "2025-06-10"}}
