# G3 reference cases, drilling contract DDS-2025-118: INPUTS ONLY (no expected values).
# Written before the G3 pricing code. Expected values are computed independently from the contract scans by
# independent readers (v1 reader instructions) into expected_*.jsonl.
# Defaults (applied by tools/g3_cases.py): one-line invoice for well NGP-SY-001 (rig NG-Rig 44, field Harran,
# class Standard) whose period is the service date and which is submitted 5 days later; the billed unit is the
# Schedule 1 unit and the billed rate is the Schedule 1 figure as printed (amount = quantity x rate), so no input
# carries an expected built-up rate. The Daily Drilling Report defaults below are overridden per case.
# Where a case fixes the reading of an open question (question_readings), the reader follows that reading.
defaults:
  invoice: {contract_ref: DDS-2025-118, contractor: Meridian Downhole Services Ltd, well_name: NGP-SY-001, rig: NG-Rig 44, field: Harran, well_class: Standard, submit_after_days: 5}
  report:
    signed: both
    A: {"Hole section": '12-1/4"', Status: Operating, "Depth start (m MD)": "2000", "Depth end (m MD)": "2100", "Circulating hours": "20", "BHA run": "1",
        "In the hole": "MWD collar, drilling jars, real-time link, rotary steerable, survey package", "Crew on tour": "2 directional hands, 1 night man, 2 MWD engineers",
        "Gyro surveys": "0", "Pressure points": "0", "Wiper trips": "0", "Back-reaming hours": "0", "Clean-out runs": "0"}
    B: {Run: "1", "Run first day": "<service date>", "Run last day": "<service date + 3>", "Tools in run": "<as In the hole>", "Run circulating hours": "80", "Metres logged": "0", "Metres reamed": "0", "Radioactive source carried": "No"}
  state: {annual_footage_pct: "100", note: "annual footage-band state is supplied as an input (G4 owns it); no other lines or invoices exist"}
