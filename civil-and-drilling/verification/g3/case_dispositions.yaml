dispositions:
  CW-S16|payable:
    reader: false
    engine: true
    disposition: 'Procedural breach, not a bar to the line''s value (G3 decision G3-D1): the window/period clauses (CW Cl.41
      p8; DDS Cl.32, Cl.33 p8) state no consequence; CW Cl.48 / DDS Cl.42 time the payment of a correct submission and do
      not forfeit its value; the contract makes a condition of payment expressly where it means one (CW Cl.46; DDS Cl.37);
      the G1 consequence table (C-PROC) treats identity, period and window failures as procedural. The reader noted
      the same figure as the ''flag only'' alternative. Scope of the alternative is in spec/g3_decisions.yaml.'
    settled_against: scan pages cited; reader note
