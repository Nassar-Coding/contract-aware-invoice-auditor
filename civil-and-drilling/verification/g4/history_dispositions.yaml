about: 'Settlement of every disagreement between the G4 engine and the isolated readers (tools/g4_history_compare.py). settled: engine (the reader''s
  value is not what the contract says; page cited), reader (engine defect, fixed), both (the contract or a registered open question leaves it
  open; the engine carries the reader''s value as an alternative), presentation (same money, different form).'
fixed_in_engine:
- 'HC-630 once per BHA run under the Schedule 8 reading (Q5 residual) was not applied: DDS-H03, r5 (audit/g4_dds.py _hc630_runs)'
- 'exclusion on the day of the excluding measurement was decided; Cl.32/Sch 4 Part 5 ''following'' vs P19 ''within two days of'' is not settled
  by the text: now carried (Q6 D) - CW-H06 r1/r2'
- 'band_divided / footage_band_divided were reported as established where the division held under some readings only: now ''unresolved'' there'
- a same-day repeat of a run/well event did not also carry Cl.29 charged_twice; a well event charged again after its day did not carry well_event_repeated
  - DDS-H03, DDS-H04, DDS-R01
- g4_core.collapse dropped a dimension present under one reading only (a label set that is not a full product) - found on DDS-H03
