generated_by: tools/record_verification.py
method: Second verification = independent visual re-read of every cell on the scan image, cross-checked against a blind transcription
  (no access to the first pass) and tesseract OCR. Disagreements were settled on the image; machine readings never override
  it.
limitations:
- The blind rule was instructed to the blind readers, not technically enforced; their transcripts show only page images and
  their own output were opened.
- Pages not re-read in the visual pass are listed at the end of the visual log; none holds a pricing table.
